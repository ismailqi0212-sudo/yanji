[project]
name = "yanji-agent"
version = "2.0.0"
description = "研迹：Python 对话投研与研报工作台"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "cryptography>=44", "pypdf>=5,<7", "fonttools>=4.55,<5", "python-docx>=1.1,<2", "opencc-python-reimplemented>=0.1.7", "json-repair>=0.30,<1", "jsonschema>=4.23,<5", "python-multipart>=0.0.18"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["python_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
